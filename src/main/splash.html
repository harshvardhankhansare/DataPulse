<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DataPulse Splash</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      width: 500px;
      height: 340px;
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-card {
      width: 480px;
      height: 320px;
      background: rgba(13, 17, 28, 0.95);
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 40px rgba(56, 189, 248, 0.25);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 32px;
      overflow: hidden;
    }
    .glow-bg {
      position: absolute;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, rgba(139, 92, 246, 0.2) 50%, transparent 70%);
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      filter: blur(35px);
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { opacity: 0.6; transform: translateX(-50%) scale(0.9); }
      100% { opacity: 1; transform: translateX(-50%) scale(1.15); }
    }
    .logo-container {
      position: relative;
      width: 76px;
      height: 76px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2.5px solid transparent;
      border-top-color: #38bdf8;
      border-bottom-color: #8b5cf6;
      animation: spinRing 2s linear infinite;
    }
    .ring-outer {
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-left-color: #06b6d4;
      border-right-color: #ec4899;
      animation: spinRing 3.5s linear reverse infinite;
      opacity: 0.75;
    }
    @keyframes spinRing {
      100% { transform: rotate(360deg); }
    }
    .logo-icon {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
    }
    .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 40%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 26px;
    }
    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(30, 41, 59, 0.85);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      width: 15%;
      background: linear-gradient(90deg, #38bdf8, #8b5cf6, #ec4899);
      border-radius: 99px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
    }
    .status-text {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 10px;
      font-weight: 500;
      height: 16px;
    }
    .badge {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 3px 8px;
      border-radius: 99px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="glow-bg"></div>
    <div class="logo-container">
      <div class="ring-outer"></div>
      <div class="ring"></div>
      <div class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
      </div>
    </div>
    <div class="title">DataPulse</div>
    <div class="subtitle">AIR-GAPPED OFFLINE INTELLIGENCE</div>
    
    <div class="progress-track">
      <div class="progress-bar" id="bar"></div>
    </div>
    <div class="status-text" id="status">Initializing DuckDB OLAP Engine...</div>
    <div class="badge">100% AIR-GAPPED</div>
  </div>

  <script>
    const bar = document.getElementById('bar');
    const status = document.getElementById('status');
    const steps = [
      { p: '35%', text: 'Initializing DuckDB OLAP Engine...' },
      { p: '65%', text: 'Loading Analytical Profiler & Rules...' },
      { p: '90%', text: 'Preparing Reactive Workspace...' },
      { p: '100%', text: 'Ready' }
    ];
    let idx = 0;
    const timer = setInterval(() => {
      if (idx < steps.length) {
        bar.style.width = steps[idx].p;
        status.innerText = steps[idx].text;
        idx++;
      } else {
        clearInterval(timer);
      }
    }, 450);
  </script>
</body>
</html>
